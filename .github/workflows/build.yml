name: Build & Release KlipperRemote

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set – cannot produce a signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release APK & AAB
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleSideloadRelease bundlePlaystoreRelease

      - name: Rename APK & AAB
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk \
             "dist/KlipperRemote-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab \
             "dist/KlipperRemote-${{ steps.version.outputs.version }}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KlipperRemote-release-apk
          path: dist/*.apk

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v7
        with:
          name: KlipperRemote-release-aab
          path: dist/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: KlipperRemote ${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automatischer signierter Release-Build von KlipperRemote.

            - Version: `${{ steps.version.outputs.version }}`
            - Build: `${{ github.run_number }}`
            - Commit: ${{ github.sha }}

            Enthält die signierte APK (Sideload) und das AAB-Bundle für die Google Play Console.
          files: |
            dist/*.apk
            dist/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
